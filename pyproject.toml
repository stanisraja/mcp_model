[project]
name = "mcp-dbserver"
version = "0.1.0"
description = "Multi-engine, read-only, security-scoped MCP server for MySQL, PostgreSQL, DynamoDB, and MongoDB Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "pymongo>=4.7",  # 4.7+ for Collection.create_search_index (Atlas Search/Vector Search index management)
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    # Generates embeddings locally via ONNX runtime -- no torch/torchvision
    # (deliberately, avoids that dependency pair's frequent version-mismatch
    # breakage), no external API call. Used by both the semantic_search_documents
    # MCP tool at runtime and scripts/load_demo_dataset.py.
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
mcp-dbserver = "mcp_dbserver.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dbserver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
